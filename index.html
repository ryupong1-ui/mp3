<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เครื่องเล่น MP3 - Ryu XP</title>

<style>
body{
  margin:0;
  font-family:-apple-system, sans-serif;
  background:#f3f4f6;
  color:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* main */
.app{
  width:520px;
  padding:25px;
  border-radius:20px;
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(20px);
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

/* buttons */
button{
  padding:8px 14px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:#e5e7eb;
  color:#111;
  cursor:pointer;
  transition:.2s;
}
button:hover{
  background:#10B981;
  color:white;
}

/* list */
ul{
  list-style:none;
  padding:0;
  max-height:200px;
  overflow:auto;
}
li{
  padding:8px;
  margin:4px 0;
  border-radius:8px;
  background:#f9fafb;
  cursor:pointer;
}
li:hover{background:#d1fae5;}
li.active{
  background:#10B981;
  color:white;
}

/* popup */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.box{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}
</style>

</head>
<body>

<!-- start -->
<div id="startPopup" class="popup" style="display:flex;">
  <div class="box">
    <h2>🎵 เครื่องเล่น MP3</h2>
    <p>create by <b>Ryu XP</b></p>
    <button id="startBtn">เริ่มใช้งาน</button>
  </div>
</div>

<!-- help -->
<div id="helpPopup" class="popup">
  <div class="box">
    <h3>📖 วิธีใช้</h3>
    <p>
      1. เลือกโฟลเดอร์<br>
      2. เลือกเพลง<br>
      3. เล่นต่ออัตโนมัติ<br>
      4. เพิ่มเพลง → กดรีเฟรช
    </p>
    <button id="closeHelpBtn">ปิด</button>
  </div>
</div>

<div class="app">
  <h2>🎧 เครื่องเล่น MP3</h2>

  <button id="pickBtn">📁 เลือกโฟลเดอร์</button>
  <button id="refreshBtn">🔄 รีเฟรช</button>
  <button id="helpBtn">❓ วิธีใช้</button>

  <a href="https://ryuxp.vercel.app" target="_blank">
    <button>⚠️ แจ้งปัญหา</button>
  </a>

  <p id="folder">ยังไม่ได้เลือกโฟลเดอร์</p>

  <audio id="player" controls></audio>
  <p id="now">ยังไม่ได้เล่น</p>

  <ul id="list"></ul>
</div>

<script>
let dir = null;
let files = [];
let index = 0;

const player = document.getElementById("player");

/* popup */
document.getElementById("startBtn").onclick = () => {
  document.getElementById("startPopup").style.display = "none";
};

document.getElementById("helpBtn").onclick = () => {
  document.getElementById("helpPopup").style.display = "flex";
};

document.getElementById("closeHelpBtn").onclick = () => {
  document.getElementById("helpPopup").style.display = "none";
};

/* folder */
document.getElementById("pickBtn").onclick = async () => {
  try{
    dir = await window.showDirectoryPicker();
    loadFiles();
  }catch(e){}
};

document.getElementById("refreshBtn").onclick = () => {
  if(!dir){
    alert("เลือกโฟลเดอร์ก่อน");
    return;
  }
  loadFiles();
};

/* load */
async function loadFiles(){
  files = [];

  for await (const entry of dir.values()){
    if(entry.kind === "file" && entry.name.toLowerCase().endsWith(".mp3")){
      files.push(entry);
    }
  }

  files.sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById("folder").innerText = "📁 " + dir.name;
  renderList();
}

/* render */
function renderList(){
  const ul = document.getElementById("list");
  ul.innerHTML = "";

  files.forEach((f,i)=>{
    const li = document.createElement("li");
    li.textContent = f.name;
    li.onclick = () => play(i);
    ul.appendChild(li);
  });
}

/* play */
async function play(i){
  index = i;

  const file = await files[i].getFile();
  const url = URL.createObjectURL(file);

  player.src = url;
  await player.play().catch(()=>{});

  document.getElementById("now").innerText = "🎶 " + file.name;

  document.querySelectorAll("li").forEach((li,j)=>{
    li.classList.toggle("active", j === i);
  });
}

/* auto next */
player.addEventListener("ended", ()=>{
  if(files.length === 0) return;

  index++;
  if(index >= files.length) index = 0;

  play(index);
});
</script>

</body>
</html>
