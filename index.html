<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Music Player</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f5f5f5;
  color:#111;
}

/* 🔐 LOGIN */
#loginPage{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#f5f5f5;
}

.login-box{
  background:#fff;
  padding:30px;
  border-radius:16px;
  width:300px;
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

.input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:8px;
  background:#fafafa;
}

.login-btn{
  width:100%;
  padding:10px;
  background:#4285f4;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

/* 🎵 APP */
#app{
  display:none;
}

header{
  padding:15px;
  background:#ffffff;
  display:flex;
  gap:10px;
  border-bottom:1px solid #ddd;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#eee;
}

button:hover{
  background:#ddd;
}

#list{
  list-style:none;
  padding:10px;
}

li{
  padding:10px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}

li:hover{
  background:#eee;
}

li.active{
  background:#dbeafe;
}

/* 🎧 PLAYER */
#playerBox{
  position:fixed;
  bottom:0;
  width:100%;
  background:#ffffff;
  padding:10px;
  border-top:1px solid #ddd;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginPage">
  <div class="login-box">
    <h2>Sign in</h2>
    <input id="username" class="input" placeholder="Username">
    <input id="password" type="password" class="input" placeholder="Password">
    <button class="login-btn" id="loginBtn">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- 🎵 APP -->
<div id="app">

<header>
  <button id="pickBtn">📁 เลือกโฟลเดอร์</button>
  <button id="refreshBtn">🔄 รีเฟรช</button>
  <button id="logoutBtn">🚪 Logout</button>
  <span id="folder">ยังไม่ได้เลือก</span>
</header>

<ul id="list"></ul>

<div id="playerBox">
  <div id="now">ยังไม่ได้เล่น</div>
  <audio id="player" controls></audio>
</div>

</div>

<script>
let dir = null;
let files = [];
let index = 0;

const player = document.getElementById("player");

/* 🔐 USERS */
const USERS = [
  { username: "Ryu XP", password: "246810" },
  { username: "แก้วตา", password: "999999" }
];

let isLoggedIn = false;

/* 🔐 LOGIN */
document.getElementById("loginBtn").onclick = () => {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  const user = USERS.find(x => x.username === u && x.password === p);

  if(user){
    isLoggedIn = true;
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("app").style.display = "block";
  }else{
    document.getElementById("error").innerText = "❌ ข้อมูลไม่ถูกต้อง";
  }
};

/* 🔓 LOGOUT */
document.getElementById("logoutBtn").onclick = () => {
  isLoggedIn = false;
  document.getElementById("app").style.display = "none";
  document.getElementById("loginPage").style.display = "flex";
};

/* 📁 PICK */
document.getElementById("pickBtn").onclick = async () => {
  if(!isLoggedIn) return alert("login ก่อน");

  try{
    dir = await window.showDirectoryPicker();
    loadFiles();
  }catch(e){}
};

/* 🔄 REFRESH */
document.getElementById("refreshBtn").onclick = () => {
  if(!dir) return alert("เลือกโฟลเดอร์ก่อน");
  loadFiles();
};

/* 📂 LOAD */
async function loadFiles(){
  files = [];

  for await (const entry of dir.values()){
    if(entry.kind === "file" && entry.name.toLowerCase().endsWith(".mp3")){
      files.push(entry);
    }
  }

  files.sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById("folder").innerText = "📁 " + dir.name;
  renderList();
}

/* 📃 LIST */
function renderList(){
  const ul = document.getElementById("list");
  ul.innerHTML = "";

  files.forEach((f,i)=>{
    const li = document.createElement("li");
    li.textContent = f.name;
    li.onclick = () => play(i);
    ul.appendChild(li);
  });
}

/* ▶️ PLAY */
async function play(i){
  index = i;

  const file = await files[i].getFile();
  const url = URL.createObjectURL(file);

  player.src = url;
  await player.play().catch(()=>{});

  document.getElementById("now").innerText = "🎶 " + file.name;

  document.querySelectorAll("li").forEach((li,j)=>{
    li.classList.toggle("active", j === i);
  });
}

/* ⏭ AUTO NEXT */
player.addEventListener("ended", ()=>{
  if(files.length === 0) return;

  index++;
  if(index >= files.length) index = 0;

  play(index);
});
</script>

</body>
</html>
