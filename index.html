<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>กำลังปรับปรุง</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .container {
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      animation: fadeIn 1.5s ease;
    }

    h1 {
      font-size: 2.5rem;
      animation: bounce 2s infinite;
    }

    .loader {
      margin: 20px auto;
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255,255,255,0.3);
      border-top: 6px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .updates {
      text-align: left;
      margin-top: 20px;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .updates li {
      margin: 5px 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px);}
      to { opacity: 1; transform: translateY(0);}
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0);}
      50% { transform: translateY(-10px);}
    }

    .footer {
      margin-top: 15px;
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚧 กำลังปรับปรุง</h1>

    <div class="loader"></div>

    <p>เว็บไซต์กำลังอัปเดต<br>ขออภัยในความไม่สะดวก</p>

    <!-- 🔔 รายการอัปเดต -->
    <div class="updates">
      <strong>📢 สิ่งที่กำลังปรับปรุง:</strong>
      <ul>
        <li>✨ ปรับปรุงหน้าตาเว็บไซต์ใหม่</li>
      </ul>
    </div>

    <div class="footer">
      จะกลับมาเร็ว ๆ นี้ 🙏
    </div>
  </div>

  <!-- 🔊 เสียง -->
  <audio id="bgSound" autoplay>
    <source src="https://www.soundjay.com/button/beep-07.wav" type="audio/wav">
  </audio>

  <script>
    // เล่นเสียงเมื่อโหลดหน้า (บาง browser ต้อง interaction ก่อน)
    window.addEventListener("load", () => {
      const sound = document.getElementById("bgSound");
      sound.volume = 0.3;

      // workaround browser block
      document.body.addEventListener("click", () => {
        sound.play();
      });
    });
  </script>

</body>
</html>
